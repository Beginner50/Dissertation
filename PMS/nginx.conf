events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    client_max_body_size 50M;

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name fypms.online www.fypms.online;
        return 301 https://$host$request_uri;
    }

    # HTTPS Server
    server {
        listen 443 ssl;
        server_name fypms.online www.fypms.online;

        ssl_certificate     /etc/letsencrypt/live/fypms.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fypms.online/privkey.pem;

        # 1. Frontend: Proxy to the 'react' service
        location / {
            proxy_pass http://react:80; 
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 2. Backend: Proxy to the 'dotnet-server' service
        location /api/ {
            # Ensure the trailing slash logic is correct
            proxy_pass http://dotnet-server:5081; 
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            
            # Timeouts for long-running API calls
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
        }
    }
}
